<title>Space Case</title>
<style>
:root { color-scheme: dark; --bg: #03040b; }
html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
#nameIn { position: fixed; z-index: 5; opacity: 0; border: 0; padding: 0; margin: 0; font-size: 16px; background: transparent; color: transparent; caret-color: transparent; outline: none; }
#nameIn[hidden], .scField[hidden] { display: none; }
.scField { position: fixed; z-index: 4; opacity: 0; border: 0; padding: 0; margin: 0; font-size: 16px; background: transparent; color: transparent; caret-color: transparent; outline: none; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; }
</style>
<canvas id="game" tabindex="0" aria-label="Space Case game"></canvas>
<input id="nameIn" hidden maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Callsign">
